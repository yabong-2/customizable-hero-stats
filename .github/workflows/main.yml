name: Build DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Full BepInEx & Unity Libraries
        run: |
          mkdir BepInEx
          mkdir BepInEx/core
          mkdir "Shape of Dreams_Data"
          mkdir "Shape of Dreams_Data/Managed"
          
          # 1. BepInEx 핵심 코어 파일 다운로드 및 배치
          curl -L -o core.zip "https://github.com"
          powershell Expand-Archive -Path core.zip -DestinationPath BepInEx/core_extracted -Force
          move BepInEx/core_extracted/BepInEx/core/* BepInEx/core/
          
          # 2. 프로젝트가 요구하는 유니티 기본 참조 라이브러리 가짜 파일 생성 (빌드 통과용)
          curl -L -o BepInEx/core/UnityEngine.dll "https://github.com"
          curl -L -o BepInEx/core/UnityEngine.CoreModule.dll "https://github.com"
          
          # 3. 추가적인 시스템 및 파일 매칭용 더미 데이터 링크 생성
          cp BepInEx/core/UnityEngine.dll "Shape of Dreams_Data/Managed/UnityEngine.dll"
          cp BepInEx/core/UnityEngine.CoreModule.dll "Shape of Dreams_Data/Managed/UnityEngine.CoreModule.dll"

      - name: Build Solution
        run: dotnet build CustomizableHeroStats.sln --configuration Release /p:ReferencePath="./BepInEx/core;./Shape of Dreams_Data/Managed"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomizableHeroStats-DLL
          path: bin/Release/**/CustomizableHeroStats.dll
